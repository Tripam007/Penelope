version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: penelope_db
    restart: always
    environment:
      POSTGRES_USER: penelope
      POSTGRES_PASSWORD: penelope_dev_secret
      POSTGRES_DB: penelope_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penelope -d penelope_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - penelope_net

  redis:
    image: redis:7-alpine
    container_name: penelope_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - penelope_net

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: penelope_api
    restart: always
    environment:
      - ENVIRONMENT=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_URL=postgresql+asyncpg://penelope:penelope_dev_secret@db:5432/penelope_db
      - DATABASE_SYNC_URL=postgresql://penelope:penelope_dev_secret@db:5432/penelope_db
      - REDIS_URL=redis://redis:6379/0
      - SIMULATE_SENSORS=True
      - MODEL_DIR=/app/ml/models
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./ml/models:/app/ml/models
    networks:
      - penelope_net

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: penelope_web
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/api/v1/ws
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    networks:
      - penelope_net

  nginx:
    image: nginx:alpine
    container_name: penelope_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    networks:
      - penelope_net

volumes:
  postgres_data:
  redis_data:

networks:
  penelope_net:
    driver: bridge
